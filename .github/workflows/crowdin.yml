name: Crowdin Action

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: crowdin action
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2.17.1
        with:
          upload_translations: false
          download_translations: true
          skip_untranslated_files: true
          push_translations: true
          export_only_approved: true
          commit_message: "feat: New Crowdin translations"
          create_pull_request: true
          pull_request_title: "New Crowdin translations"
          pull_request_labels: "enhancement"
          base_url: "https://jenkins.crowdin.com"
          config: "crowdin.yml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 4
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
